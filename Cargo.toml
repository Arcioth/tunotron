[package]
name = "tunotron"
version = "0.3.2"
edition = "2021"
authors = ["Arcioth"]
description = "A minimal, rock-solid, extensible terminal music player"
license = "MIT OR Apache-2.0"

[dependencies]
# TUI & Terminal Handling
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async Runtime & Concurrency
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio Metadata
lofty = "0.21"

# Process & System
libc = "0.2"
walkdir = "2"

# Diagnostics & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
